name: Build, Test, and Deploy Web App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  # STAGE 1: CONTINUOUS INTEGRATION (AUTOMATED TESTING)
  test:
    name: 1. Run Unit & IAM Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Automated Pytest Suite
        run: pytest -m pytest -v

  # STAGE 2: BUILD DOCKER CONTAINER & SECURITY SCAN
  build-and-scan:
    name: 2. Build & Scan Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t webapp-cicd:${{ github.sha }} .

      - name: Scan Docker Image for Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: webapp-cicd:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/automated-webapp-cicd-pipeline
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker tag webapp-cicd:${{ github.sha }} $IMAGE_ID:latest
          docker push $IMAGE_ID:latest

  # STAGE 3: CONTINUOUS DEPLOYMENT TO LIVE CLOUD URL
  deploy:
    name: 3. Deploy to Cloud
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Live Cloud Deployment via Secure Webhook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
            echo "Triggered live cloud deployment on Render!"
          else
            echo "Build & Container Push succeeded! Add RENDER_DEPLOY_HOOK secret to enable live cloud deploy."
          fi
